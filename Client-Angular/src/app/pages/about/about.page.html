@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando Información del Proyecto..."></app-alert>
  }

  @case ('error') {
    <app-alert alertState="error" text="Error al Cargar la Información"></app-alert>
  }

  @case ('success') {
    <app-about-card [aboutInfo]="aboutInfo"></app-about-card>
  }
}
