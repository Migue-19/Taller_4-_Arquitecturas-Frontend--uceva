@if (aboutInfo) {
  <div class="row g-4">
    <!-- Tarjeta Principal de Información -->
    <div class="col-12">
      <div class="card shadow-sm border">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
          <h5 class="mb-0 text-primary">{{ aboutInfo.title }}</h5>
          <dsb-badge-atom text="UCEVA - Arquitectura Web" type="primary"></dsb-badge-atom>
        </div>
        <div class="card-body">
          <p class="card-text fs-5 text-secondary">{{ aboutInfo.description }}</p>
          <hr />
          <p class="card-text text-muted"><strong>Enfoque:</strong> {{ aboutInfo.projectScope }}</p>
        </div>
      </div>
    </div>

    <!-- Contadores Estadísticos -->
    <div class="col-md-4">
      <div class="card shadow-sm border text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center align-items-center">
          <span class="text-muted fw-bold text-uppercase mb-2">Total Usuarios</span>
          <h2 class="display-5 text-success mb-2">{{ aboutInfo.totalUsers }}</h2>
          <dsb-badge-atom text="Registros" type="success"></dsb-badge-atom>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center align-items-center">
          <span class="text-muted fw-bold text-uppercase mb-2">Total Productos</span>
          <h2 class="display-5 text-warning mb-2">{{ aboutInfo.totalProducts }}</h2>
          <dsb-badge-atom text="En Catálogo" type="warning"></dsb-badge-atom>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center align-items-center">
          <span class="text-muted fw-bold text-uppercase mb-2">Categorías</span>
          <h2 class="display-5 text-danger mb-2">{{ aboutInfo.totalCategories }}</h2>
          <dsb-badge-atom text="Agrupaciones" type="danger"></dsb-badge-atom>
        </div>
      </div>
    </div>
  </div>
}
